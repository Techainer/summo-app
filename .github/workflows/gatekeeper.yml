# What macOS actually does to a copy somebody downloaded.
#
# The release job starts the app it just built, which proves the bundle runs and the signature is
# valid. It proves nothing about the copy a person gets, because a file built on the machine has no
# `com.apple.quarantine` on it — and quarantine is the whole of Gatekeeper. So this takes the
# published `.dmg`, marks it the way a browser marks a download, and reports exactly what macOS
# says: the assessment, the dialog text, and whether "Open Anyway" is offered at all.
#
# Run it by hand, against a tag:
#   gh workflow run gatekeeper.yml -f tag=v0.2.2
name: what a Mac says about a downloaded copy

on:
  workflow_dispatch:
    inputs:
      tag:
        description: The release tag to test
        required: true
        default: v0.2.2

jobs:
  quarantined:
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      # For the scripts. This job used to need nothing but `gh`, and now it runs the same two
      # checks the release job runs, against the published copy rather than the built one.
      - uses: actions/checkout@v4

      - name: macOS version
        run: sw_vers

      - name: Fetch the published disk image
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download "${{ inputs.tag }}" --repo "${{ github.repository }}" \
            --pattern '*aarch64.dmg' --dir .
          ls -la ./*.dmg

      # What Safari writes onto a download: the flag, the agent, and where it came from. Without
      # this the file is simply a local file and Gatekeeper never looks at it.
      - name: Mark it the way a browser would
        run: |
          DMG=$(ls ./*.dmg | head -1)
          xattr -w com.apple.quarantine \
            "0083;00000000;Safari;F1B2C3D4-0000-0000-0000-000000000000" "$DMG"
          xattr -l "$DMG"

      - name: What is inside the image
        run: |
          DMG=$(ls ./*.dmg | head -1)
          hdiutil attach "$DMG" -nobrowse -mountpoint /Volumes/summo-test
          echo "--- contents"
          ls -la /Volumes/summo-test
          echo "--- is there an Applications shortcut to drag onto?"
          if [ -L /Volumes/summo-test/Applications ]; then
            echo "yes: $(readlink /Volumes/summo-test/Applications)"
          else
            echo "NO — the window has nothing to drop the app onto"
          fi
          echo "--- window layout (.DS_Store is what positions the icons)"
          ls -la /Volumes/summo-test/.DS_Store 2>/dev/null || echo "no .DS_Store: icons land wherever Finder puts them"
          echo "--- background picture"
          ls -la /Volumes/summo-test/.background 2>/dev/null || echo "no .background"

      - name: Copy it to Applications, the way dragging does
        run: |
          # `ditto` keeps extended attributes, which is what Finder does — and the quarantine flag
          # riding along is the entire point of this test.
          ditto /Volumes/summo-test/Summo.app /Applications/Summo.app
          xattr -w -r com.apple.quarantine \
            "0083;00000000;Safari;F1B2C3D4-0000-0000-0000-000000000000" /Applications/Summo.app
          echo "--- quarantine on the installed copy"
          xattr -p com.apple.quarantine /Applications/Summo.app || echo "(none)"

      - name: The signature it carries
        run: codesign -dv --verbose=4 /Applications/Summo.app 2>&1 || true

      # The verdict Gatekeeper reaches, and the wording it reaches it with. `--raw` prints the whole
      # assessment; the exit status says whether it would be allowed.
      - name: What Gatekeeper assesses
        run: |
          set +e
          spctl --assess --type execute --verbose=4 /Applications/Summo.app 2>&1
          echo "spctl exit: $?"
          echo "--- as an install rather than an execution"
          spctl --assess --type install --verbose=4 /Applications/Summo.app 2>&1
          echo "spctl exit: $?"
          exit 0

      # What macOS will actually say, from macOS.
      #
      # `spctl --assess` answers `rejected` for anything not notarised, and that is where the
      # reading used to stop — from which the download page concluded a terminal command was
      # required. It is not the same question. `rejected` decides whether the app opens *without
      # asking*; a validly signed app that is rejected still gets the "Open Anyway" button in
      # System Settings, and only a *broken* signature produces "is damaged", where that button
      # does not appear and there is no way through but the terminal.
      #
      # `syspolicy_check` is the tool that distinguishes them, and it ships with macOS.
      - name: What the dialog will say
        timeout-minutes: 4
        run: |
          set +e
          echo "--- syspolicy_check distribution"
          syspolicy_check distribution /Applications/Summo.app 2>&1
          echo "--- syspolicy_check notary"
          syspolicy_check notary-submission /Applications/Summo.app 2>&1
          echo "--- is the signature itself valid? (the difference between 'unverified' and 'damaged')"
          codesign --verify --deep --strict --verbose=2 /Applications/Summo.app 2>&1
          echo "codesign --verify exit: $?"
          exit 0

      # Opening it is not the same as it working.
      #
      # `open` returns as soon as launchd has the app, and the step above reports whatever is
      # running eight seconds later — which is the window. The window then starts the daemon, and
      # the daemon is where a downloaded copy of `v0.2.6` died: the hardened runtime turns on
      # library validation, an ad-hoc signature has no team, and library validation lets a process
      # with no team load nothing that is not part of macOS. Both libraries the daemon needs are
      # in the bundle.
      #
      # Reported rather than fatal, like everything else here: this workflow exists to say what a
      # Mac does, and a red tick against a published tag helps nobody. `scripts/mac-signing.sh`
      # is the check that fails a build.
      - name: Does the daemon inside it start, on a copy that was downloaded
        timeout-minutes: 6
        run: |
          set +e
          # Before anything opens a window. `open` hands the app to launchd, and on a runner with
          # no logged-in session that step has sat until the job's own timeout killed it — taking
          # this check with it, on the run that was meant to produce the evidence.
          chmod +x scripts/*.sh
          ./scripts/mac-signing.sh /Applications/Summo.app
          echo "mac-signing exit: $?"
          ./scripts/smoke-desktop.sh /Applications/Summo.app
          echo "smoke exit: $?"
          exit 0

      - name: Try to open it the way a person double-clicks
        timeout-minutes: 3
        run: |
          set +e
          # Not `open -W`: that waits for the app to *exit*, so an app that opens correctly hangs
          # the step until the job times out — which is what the first run of this did.
          open /Applications/Summo.app
          echo "open exit: $?"
          sleep 8
          echo "--- did anything start?"
          pgrep -fl summo || echo "nothing running"
          exit 0

      - name: What the system logged about it
        run: |
          set +e
          log show --last 3m --predicate 'subsystem CONTAINS "syspolicy" OR process == "kernel"' \
            --style compact 2>/dev/null | grep -iE "summo|quarantine|gatekeep|assess|malicious|damaged" | head -40
          exit 0

      # The same app with the flag taken off, which is what the README tells people to do. If this
      # starts and the quarantined one does not, the terminal line is load-bearing and the download
      # cannot be opened from Finder at all.
      - name: And with the quarantine flag removed
        timeout-minutes: 4
        run: |
          set +e
          xattr -dr com.apple.quarantine /Applications/Summo.app
          spctl --assess --type execute --verbose=4 /Applications/Summo.app 2>&1
          echo "spctl exit: $?"
          open /Applications/Summo.app
          sleep 8
          pgrep -fl summo && echo "started once the flag was gone" || echo "still did not start"
          pkill -f summo-desktop; pkill -f summo-engine
          exit 0

      - name: Unmount
        if: always()
        run: hdiutil detach /Volumes/summo-test || true
