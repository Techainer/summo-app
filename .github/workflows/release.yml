name: release

# Bundles are built from a tag, on the platform they target.
#
# Cross-compiling would be cheaper and would be wrong here: the recognition build links ONNX Runtime
# and sherpa-onnx, both C++ libraries whose prebuilt artefacts are per-platform, and a cross build
# that "succeeds" tends to produce a binary that fails to load them on the machine it was built for.
# Native runners cost minutes and remove a whole class of report we could not reproduce.
on:
  push:
    tags: ["v*"]
  # Buildable on demand, because the first time anyone finds out the release job is broken should
  # not be the day of a release.
  workflow_dispatch:

permissions:
  contents: write

jobs:
  bundle:
    strategy:
      # One platform failing should not cancel the others: a macOS toolchain problem is not a reason
      # to withhold the Linux build somebody is waiting for.
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
          - os: macos-latest
            target: aarch64-apple-darwin
          # No Intel macOS. GitHub retired the `macos-13` image, and a job asking for a label with
          # no runners behind it queues instead of failing — so this entry produced nothing for two
          # releases running while appearing to still be building. See the note on `plan` in
          # `ci.yml` for what it would take to bring it back, and `bundle.sh`, which still builds
          # the target for anyone who has the hardware.
          - os: windows-latest
            target: x86_64-pc-windows-msvc
          # `aarch64-pc-windows-msvc` is absent on purpose — see the note in `ci.yml`. Opus has no
          # ARM64 Windows build in `audiopus_sys`, so the target cannot be produced at all yet.

    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      # ALSA headers: `summo-audio` links cpal, which needs them to build even though this bundle
      # never opens a microphone on CI.
      - name: System dependencies
        if: runner.os == 'Linux'
        run: ./scripts/apt.sh libasound2-dev autoconf automake libtool

      # Opus is built from source and linked in (`OPUS_STATIC=1` in `bundle.sh`), so the tarball
      # does not depend on a libopus that happens to be installed on the build machine. Building it
      # needs autotools, which no runner image ships.
      - name: Autotools, for building Opus from source
        if: runner.os == 'macOS'
        run: brew install autoconf automake libtool

      # No cache here, on purpose.
      #
      # A release is built from scratch. The first two attempts at this workflow failed on macOS and
      # Windows with `search path … not found` and `cannot open input file 'cargs.lib'` — a restored
      # `target/` that recorded paths into ONNX Runtime and sherpa-onnx caches which live in
      # `~/Library/Caches` on macOS and `AppData\Local` on Windows, and were not restored with it.
      #
      # That class of failure is worth ten minutes per platform to remove entirely. A cache exists
      # to make an answer arrive sooner; here the answer is an artefact somebody downloads, and one
      # built from a half-restored state is a download that fails on a stranger's machine. `ci.yml`
      # keeps its caches — being wrong there costs a re-run, not a release.

      # Bash on every platform, including Windows, where the runner ships Git Bash. One script that
      # knows the three differences (`.exe`, how to ask the linker for its libraries, which checksum
      # tool exists) beats three scripts that drift.
      - name: Bundle
        shell: bash
        run: ./scripts/bundle.sh

      # The smaller build, for anyone who wants the vault and the agent without 15 MB of ONNX
      # Runtime — a server, a container, a machine that will never record anything.
      - name: Bundle without recognition
        shell: bash
        run: ./scripts/bundle.sh --no-models

      # The claim the product is sold on, checked on the artefact that is about to be published
      # rather than on a debug build from a developer's machine.
      # `pnpm -C apps/web exec`, not `npx`. Playwright is a dev dependency of the web package, so in
      # a pnpm workspace its binary is in `apps/web/node_modules/.bin` and nowhere else — `npx`,
      # run from the repository root, found nothing and this step exited 127. It has done that on
      # every release run there has ever been, including the one that produced `v0.1.0`: a release
      # is the one workflow whose failures nobody sees until they need it.
      - name: First run
        if: runner.os == 'Linux'
        # Bounded: `playwright install --with-deps` runs its own `apt-get`, and that call has sat
        # for more than half an hour on a mirror that was not answering.
        timeout-minutes: 20
        run: |
          ./scripts/apt.sh
          pnpm -C apps/web exec playwright install --with-deps chromium
          node apps/web/e2e/first-run.mjs \
            "dist/summo-$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)-${{ matrix.target }}/summo"

      - uses: actions/upload-artifact@v4
        with:
          name: summo-${{ matrix.target }}
          path: |
            dist/*.tar.gz
            dist/*.zip
            dist/*.sha256

      - name: Publish
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.tar.gz
            dist/*.zip
            dist/*.sha256
          # Written by hand. A changelog generated from commit subjects tells a user what changed in
          # the code; they want to know what changed for them.
          draft: true

  # The installers.
  #
  # This job did not exist, and the consequence was quiet: `scripts/sidecar.sh` and the whole desktop
  # shell were built by CI on every pull request and shipped to nobody. Every release of this
  # product so far has been a tarball with a command in it — which is the right thing for a server
  # and the wrong thing for the audience the app is drawn for.
  #
  # Separate from `bundle` rather than folded into it: a Tauri build needs the platform's webview
  # development libraries, it is the slower of the two, and a failure in it should not withhold the
  # tarball that has been shipping for months.
  installers:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: macos-latest
            target: aarch64-apple-darwin
          - os: windows-latest
            target: x86_64-pc-windows-msvc

    runs-on: ${{ matrix.os }}
    # A flag, not the identity. It has to be at the job rather than on the step that reads it — a
    # step's own `env` is not in scope for that step's `if`, and `secrets` is in scope for neither —
    # and it must not be called `APPLE_SIGNING_IDENTITY`, because Tauri reads that name and prefers
    # it to the config. Set to the empty string it overrode `signingIdentity: "-"`, and the Mac
    # build of v0.2.3 died with `Signing with identity ""` … `no identity found`.
    env:
      HAS_DEVELOPER_ID: ${{ secrets.APPLE_SIGNING_IDENTITY != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: System dependencies
        if: runner.os == 'Linux'
        run: |
          ./scripts/apt.sh libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev \
            librsvg2-dev libasound2-dev autoconf automake libtool patchelf
      - name: Autotools, for building Opus from source
        if: runner.os == 'macOS'
        run: brew install autoconf automake libtool

      - run: pnpm install --frozen-lockfile

      # No cache, for the reason the tarball job gives at length: a release is built from scratch.
      #
      # `beforeBuildCommand` in `tauri.conf.json` builds the interface and stages the daemon, so
      # this one command produces the whole thing.
      # A real Developer ID, when this repository has been given one.
      #
      # Without it the Mac build is signed ad-hoc, which is enough for the binary to *run* and not
      # enough for Gatekeeper: a downloaded copy is assessed `rejected` — measured, on macOS 26.5,
      # by `.github/workflows/gatekeeper.yml` — so the first launch needs a terminal line. There is
      # no free way around that. Apple's own path costs $99 a year, and this is the whole of the
      # work on our side: set four secrets and the next tag notarises itself.
      #
      #   APPLE_CERTIFICATE           base64 of the Developer ID Application .p12
      #   APPLE_CERTIFICATE_PASSWORD  the password that .p12 was exported with
      #   APPLE_SIGNING_IDENTITY      e.g. "Developer ID Application: Techainer (TEAMID)"
      #   APPLE_ID / APPLE_PASSWORD / APPLE_TEAM_ID   an app-specific password, for notarytool
      #
      # The identity is written into the config rather than passed as an environment variable,
      # because the config already names one — `signingIdentity: "-"`, the ad-hoc marker — and a
      # build that silently ignored the certificate would ship exactly the artefact this is meant
      # to replace.
      - name: Use the Developer ID, if there is one
        if: runner.os == 'macOS' && env.HAS_DEVELOPER_ID == 'true'
        env:
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          config=apps/desktop/src-tauri/tauri.conf.json
          jq --arg id "$APPLE_SIGNING_IDENTITY" '.bundle.macOS.signingIdentity = $id' "$config" > "$config.tmp"
          mv "$config.tmp" "$config"
          jq '.bundle.macOS.signingIdentity' "$config"

          # Handed to the build step through the environment file rather than set on it directly.
          # An `env:` block on that step would define these on *every* run, and an empty
          # `APPLE_CERTIFICATE` is not the same as an absent one: Tauri sees a certificate, runs
          # `security import` on nothing, and the build dies with "failed to import keychain
          # certificate". Which is what v0.2.3 did — the comment above this used to claim Tauri
          # treated empty as absent, and nobody had run it.
          {
            echo "APPLE_SIGNING_IDENTITY=$APPLE_SIGNING_IDENTITY"
            echo "APPLE_CERTIFICATE=$APPLE_CERTIFICATE"
            echo "APPLE_CERTIFICATE_PASSWORD=$APPLE_CERTIFICATE_PASSWORD"
            echo "APPLE_ID=$APPLE_ID"
            echo "APPLE_PASSWORD=$APPLE_PASSWORD"
            echo "APPLE_TEAM_ID=$APPLE_TEAM_ID"
          } >> "$GITHUB_ENV"

      - name: Build the installers
        # AppImage's tooling is itself an AppImage, and mounting one needs FUSE, which the runner
        # images stopped shipping. `linuxdeploy` then fails with nothing but "failed to run
        # linuxdeploy". The variable is the AppImage runtime's own answer: unpack and run instead
        # of mounting. Harmless everywhere else.
        #
        # The Apple variables are *not* here: the step above puts them in the environment file, and
        # only when there is a certificate to put there. See the note it carries.
        env:
          APPIMAGE_EXTRACT_AND_RUN: 1
        run: pnpm -C apps/desktop exec tauri build

      # Started, before it is offered to anybody.
      #
      # Linux only, because that is the platform this can be done on without a signed build and a
      # logged-in session: the AppImage runs under a virtual display, spawns its daemon and answers.
      # It is the check that would have caught the version of this bundle whose daemon exited on a
      # missing library — which was published, downloaded, and opened a window with nothing in it.
      #
      # Every platform runs its own bundle now. macOS was the last one that shipped unopened, and
      # what it was hiding was total: the app it produced could not be launched at all.
      - name: The app starts, and its daemon answers
        if: runner.os == 'Linux'
        run: |
          ./scripts/apt.sh xvfb
          ./scripts/smoke-desktop.sh \
            "$(find apps/desktop/src-tauri/target/release/bundle/appimage -name '*.AppImage' | head -1)"

      # The same check on the Mac, which is the only Mac this project has.
      #
      # A user opened the 0.2.0 build and was told "Summo is damaged and can't be opened". Not a
      # warning about an unknown developer — a refusal: Apple Silicon will not run a binary with no
      # signature at all, and the bundle had none, because the sidecar daemon and its libraries are
      # copied in as resources. The bundle is ad-hoc signed now, and this runs the result: the
      # signature is verified and the app is started, which is the pair of facts nobody had checked
      # on this platform.
      - name: The Mac app is signed, starts, and its daemon answers
        if: runner.os == 'macOS'
        run: |
          # Out of the disk image, not out of the build directory. The `.app` under `bundle/macos`
          # is an intermediate — the first version of this step looked for one there, found nothing,
          # and handed the empty string to the smoke script — while the `.dmg` is the file a person
          # downloads, and mounting it is the only way to check the thing that is actually shipped.
          DMG="$(find apps/desktop/src-tauri/target -name '*.dmg' | head -1)"
          echo "mounting ${DMG}"
          hdiutil attach -nobrowse -readonly "${DMG}"
          APP="$(find /Volumes -maxdepth 3 -name '*.app' -type d | head -1)"
          echo "found ${APP}"
          # Copied off the image first: a read-only volume is not where an app runs, and the smoke
          # test writes a vault beside nothing — but `codesign` on a mounted image can also report a
          # signature the copied bundle would not have.
          # Into `~/Applications`, not `/tmp`. Tauri resolves its sidecar from `current_exe()` and
          # refuses a path containing a symlink on macOS — and `/tmp` is a symlink to `/private/tmp`,
          # so the app started, could not find the daemon inside itself, and reported "this build has
          # no daemon in it". Nothing to do with the build; everything to do with where it was run
          # from, which is why it is run from where a person would put it.
          mkdir -p "${HOME}/Applications"
          rm -rf "${HOME}/Applications/Summo.app"
          cp -R "${APP}" "${HOME}/Applications/Summo.app"
          hdiutil detach "$(dirname "${APP}")" || true

          # What the signature permits, before anything is started.
          #
          # The run below is not enough and `v0.2.6` is how we know: it started here and died on
          # the first Mac that downloaded it, because the machine that builds a bundle is the one
          # machine that runs it leniently. This reads the property instead of trying to provoke
          # the behaviour.
          ./scripts/mac-signing.sh "${HOME}/Applications/Summo.app"

          # And marked the way a browser marks a download, which is closer to the copy people get
          # than a freshly built one — a bundle built locally has never carried
          # `com.apple.quarantine`, and quarantine is the whole of Gatekeeper.
          #
          # It does *not* reproduce the failure above, and that is worth writing down rather than
          # leaving as a plausible story: `gatekeeper.yml` ran the broken `v0.2.6` on a runner, with
          # the flag set, and the daemon started anyway. Library validation is enforced by the
          # machine, and this one does not enforce it the way the machine that reported the bug
          # does. So the check that catches this is the static one above; this is here because it
          # is a truer version of the same run, not because it is the guard.
          xattr -w -r com.apple.quarantine \
            "0083;00000000;Safari;F1B2C3D4-0000-0000-0000-000000000000" \
            "${HOME}/Applications/Summo.app"

          ./scripts/smoke-desktop.sh "${HOME}/Applications/Summo.app"

      # And Windows, started from the layout the installer produces.
      #
      # Not through the installer itself: `msiexec /qn` sat for five minutes on the runner without
      # printing anything and was killed by the step's own timeout, twice. A silent MSI install on a
      # non-interactive session is its own problem, and it is not the one worth spending a release
      # job on — what has broken on every other platform is the app failing to find the daemon
      # beside it, and that is a question about the *layout*, which this reproduces: the sidecar is
      # named the way the bundle names it and put next to the executable.
      #
      # So: the MSI is built and its contents are checked, and the app is run. That the installer
      # itself completes on a real desktop is still unverified, and saying so is better than a green
      # tick that means something narrower than it looks.
      - name: The Windows app starts, and its daemon answers
        if: runner.os == 'Windows'
        shell: bash
        timeout-minutes: 8
        run: |
          cd apps/desktop/src-tauri/target/release
          ls -l *.exe | head
          # Tauri names a sidecar with its target triple in the build directory and strips it when
          # bundling. The app looks for the stripped name, so this is the rename the installer does.
          for candidate in summo-engine-*.exe; do
            [[ -e "${candidate}" ]] || continue
            cp -f "${candidate}" summo-engine.exe
          done
          ls -l summo-engine.exe
          cd - > /dev/null
          ./scripts/smoke-desktop.sh apps/desktop/src-tauri/target/release/summo-desktop.exe

      # No certificate on any platform, and two different consequences.
      #
      # Windows shows a SmartScreen warning and lets the user through. macOS is stricter and the
      # first version of this comment got it wrong: on Apple Silicon an *unsigned* binary is not
      # "unverified", it is refused outright — "Summo is damaged and can't be opened", which is what
      # a user was actually shown. The bundle is now ad-hoc signed (`signingIdentity: "-"`), which
      # is free and takes it back to the warning it should have been: right-click → Open, once.
      # Removing the warning entirely needs a Developer ID certificate and notarisation, which is a
      # paid Apple account and a decision for whoever owns it.
      #
      # Until then a user who double-clicks still meets Gatekeeper's quarantine flag, so the release
      # notes carry the one-line way past it:
      #   xattr -dr com.apple.quarantine /Applications/Summo.app
      - uses: actions/upload-artifact@v4
        with:
          name: summo-installers-${{ matrix.target }}
          path: |
            apps/desktop/src-tauri/target/release/bundle/deb/*.deb
            apps/desktop/src-tauri/target/release/bundle/appimage/*.AppImage
            apps/desktop/src-tauri/target/release/bundle/dmg/*.dmg
            apps/desktop/src-tauri/target/release/bundle/msi/*.msi
            apps/desktop/src-tauri/target/release/bundle/nsis/*.exe

      - name: Publish
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            apps/desktop/src-tauri/target/release/bundle/deb/*.deb
            apps/desktop/src-tauri/target/release/bundle/appimage/*.AppImage
            apps/desktop/src-tauri/target/release/bundle/dmg/*.dmg
            apps/desktop/src-tauri/target/release/bundle/msi/*.msi
            apps/desktop/src-tauri/target/release/bundle/nsis/*.exe
          draft: true

  # The phone build, published only when there is a key to sign it with.
  #
  # An unsigned `.apk` attached to a release is worse than none: it downloads, and then the phone
  # refuses to install it, and the person who tried has no way to know why. So this job produces one
  # on every tag and attaches it only if it was signed.
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: rustup target add aarch64-linux-android
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: android-actions/setup-android@v3
      - name: The NDK
        run: |
          sdkmanager --install "ndk;27.2.12479018" > /dev/null
          echo "NDK_HOME=$ANDROID_HOME/ndk/27.2.12479018" >> "$GITHUB_ENV"
          # bindgen runs its own clang, and it does not inherit the cross-compiler's header paths.
          # `sherpa-rs-sys` generates bindings, so without this it reads the *host's*
          # `/usr/include` and dies on `bits/libc-header-start.h` — several hundred crates into an
          # otherwise correct Android build, and only since recognition was enabled for arm64.
          sysroot="$ANDROID_HOME/ndk/27.2.12479018/toolchains/llvm/prebuilt/linux-x86_64/sysroot"
          echo "BINDGEN_EXTRA_CLANG_ARGS_aarch64_linux_android=--sysroot=$sysroot --target=aarch64-linux-android26" >> "$GITHUB_ENV"
      - name: Opus for arm64
        run: |
          echo "OPUS_LIB_DIR=$(./scripts/opus-android.sh arm64-v8a | tail -1)" >> "$GITHUB_ENV"
          echo "OPUS_STATIC=1" >> "$GITHUB_ENV"
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - name: The signing key, if this repository has one
        id: key
        env:
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        if: env.KEYSTORE != ''
        run: |
          echo "$KEYSTORE" | base64 -d > "$RUNNER_TEMP/summo.keystore"
          echo "ANDROID_KEYSTORE=$RUNNER_TEMP/summo.keystore" >> "$GITHUB_ENV"
          echo "ANDROID_KEYSTORE_PASSWORD=${{ secrets.ANDROID_KEYSTORE_PASSWORD }}" >> "$GITHUB_ENV"
          echo "ANDROID_KEY_ALIAS=${{ secrets.ANDROID_KEY_ALIAS }}" >> "$GITHUB_ENV"
          echo "ANDROID_KEY_PASSWORD=${{ secrets.ANDROID_KEY_PASSWORD }}" >> "$GITHUB_ENV"
          echo "signed=true" >> "$GITHUB_OUTPUT"

      - run: pnpm -C apps/mobile exec tauri android init --skip-targets-install

      # `init` regenerates the Gradle project from Tauri's templates, and the signing plumbing is
      # something this repository added to `app/build.gradle.kts` by hand. If a future version of
      # the template wins that argument, the build carries on happily and produces an unsigned
      # `.apk` — which installs on nothing, and which the job would have published because a secret
      # existed. Cheaper to notice here than in a bug report from someone whose phone refused it.
      - name: The signing plumbing survived `init`
        run: |
          gradle=apps/mobile/src-tauri/gen/android/app/build.gradle.kts
          if ! grep -q "ANDROID_KEYSTORE" "$gradle"; then
            echo "::warning::tauri android init overwrote the signing config; restoring the committed one"
            git checkout -- "$gradle"
          fi

      - run: pnpm -C apps/mobile exec tauri android build --apk --target aarch64

      # Whether the file is signed, asked of the file.
      #
      # `steps.key.outputs.signed` only ever meant "a secret was set", and the Publish step below
      # used it as though it meant "the artefact is installable". Those are the same thing exactly
      # as long as every link between them works, which is the assumption that has broken on every
      # other platform in this workflow at least once.
      - name: Is the .apk actually signed
        id: apk
        run: |
          apk="$(find apps/mobile/src-tauri/gen/android/app/build/outputs/apk -name '*.apk' | head -1)"
          if [ -z "$apk" ]; then
            echo "no .apk was produced" >&2
            exit 1
          fi

          # Gradle calls it `app-universal-release.apk`, which is what somebody would find in their
          # Downloads folder next to `Summo_0.2.9_aarch64.dmg`. Named the way the other platforms
          # are named, so a person can tell what it is and which version they have.
          version="$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)"
          named="$(dirname "$apk")/Summo_${version}_arm64.apk"
          mv "$apk" "$named"
          apk="$named"
          apksigner="$(find "$ANDROID_HOME/build-tools" -name apksigner | sort | tail -1)"
          if "$apksigner" verify --print-certs "$apk"; then
            echo "signed=true" >> "$GITHUB_OUTPUT"
            echo "$apk is signed"
          else
            echo "signed=false" >> "$GITHUB_OUTPUT"
            echo "$apk is NOT signed — a phone will refuse to install it"
          fi

      # A repository with a key that produced an unsigned build is broken, and quietly publishing
      # nothing is how it would stay broken. Say so and fail.
      - name: A key was configured, so the build must have used it
        if: steps.key.outputs.signed == 'true' && steps.apk.outputs.signed != 'true'
        run: |
          echo "ANDROID_KEYSTORE_BASE64 is set and the .apk came out unsigned." >&2
          echo "The keystore reached the runner and the Gradle build did not use it." >&2
          exit 1

      - uses: actions/upload-artifact@v4
        with:
          name: summo-android-arm64
          path: apps/mobile/src-tauri/gen/android/app/build/outputs/apk/**/*.apk

      - name: Publish
        if: startsWith(github.ref, 'refs/tags/') && steps.apk.outputs.signed == 'true'
        uses: softprops/action-gh-release@v2
        with:
          files: apps/mobile/src-tauri/gen/android/app/build/outputs/apk/**/*.apk
          draft: true

  # Tell the marketing site there is something new to point at.
  #
  # `summo.techainer.com` names the actual files — `Summo_0.2.6_aarch64.dmg`, with its size — rather
  # than sending people to a list of twenty. It reads that list when it builds, and it builds when
  # its own repository changes, which is not when a release happens. So without this the download
  # button spends the days between a release and the next copy edit offering the version before.
  #
  # A deploy hook is a URL that starts a build and nothing else: no token, no scope, no access to
  # anything. `SITE_DEPLOY_HOOK` is not set in every fork of this repository and does not need to be
  # — the site then shows the release it was built with, and says which one that is.
  #
  # Last, and never fatal. A release that is built, signed, smoke-tested and published is not a
  # failed release because a static site did not rebuild.
  site:
    needs: [bundle, installers]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - name: Rebuild the download page
        env:
          HOOK: ${{ secrets.SITE_DEPLOY_HOOK }}
        run: |
          if [ -z "$HOOK" ]; then
            echo "no SITE_DEPLOY_HOOK set — the site will show the release it was last built with"
            exit 0
          fi
          # The URL *is* the credential, so it is handed over on standard input rather than as an
          # argument: an argument is in the process list for as long as the request takes, and in
          # any shell trace that gets turned on later.
          if printf 'url = "%s"\n' "$HOOK" | curl -fsS -X POST --config - > /dev/null; then
            echo "asked the site to rebuild"
          else
            echo "the site did not take the hook; it will rebuild on its next push"
          fi
