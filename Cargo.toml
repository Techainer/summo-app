[workspace]
resolver = "3"
members = [
    "crates/summo-core",
    "crates/summo-media",
    "crates/summo-models",
    "crates/summo-vad",
    "crates/summo-audio",
    "crates/summo-asr",
    "crates/summo-diar",
    "crates/summo-llm",
    "crates/summo-mt",
    "crates/summo-vault",
    "crates/summo-store",
    "crates/summo-agent",
    "crates/summo-sync",
    "crates/summo-tts",
    "crates/summo-calendar",
    "crates/summo-mcp",
    "crates/summo-pipeline",
    "crates/summo-engine",
    "crates/summo-bench",
    "crates/summo-cli",
]

[workspace.package]
version = "0.4.1"
edition = "2024"
rust-version = "1.90"
license = "AGPL-3.0-or-later"
repository = "https://github.com/summo-app/summo"
homepage = "https://summo.app"
authors = ["Summo contributors"]

[workspace.dependencies]
# --- internal ---
summo-core = { path = "crates/summo-core" }
summo-media = { path = "crates/summo-media" }
summo-models = { path = "crates/summo-models" }
summo-vad = { path = "crates/summo-vad" }
summo-audio = { path = "crates/summo-audio" }
summo-engine = { path = "crates/summo-engine" }
summo-asr = { path = "crates/summo-asr" }
summo-diar = { path = "crates/summo-diar" }
summo-llm = { path = "crates/summo-llm" }
summo-mt = { path = "crates/summo-mt" }
summo-vault = { path = "crates/summo-vault" }
summo-store = { path = "crates/summo-store" }
summo-agent = { path = "crates/summo-agent" }
summo-sync = { path = "crates/summo-sync" }
summo-tts = { path = "crates/summo-tts" }
summo-calendar = { path = "crates/summo-calendar" }
summo-mcp = { path = "crates/summo-mcp" }
summo-pipeline = { path = "crates/summo-pipeline" }

# --- error / logging ---
anyhow = "1"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }

# --- serde ---
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
toml = "0.9"

# --- async ---
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "fs", "io-util", "signal", "process"] }
tokio-util = "0.7"
futures = "0.3"
async-trait = "0.1"

# --- net ---
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "stream", "json"] }
axum = { version = "0.8", features = ["ws"] }
tower-http = { version = "0.6", features = ["cors", "fs"] }

# --- crypto / hashing ---
sha2 = "0.10"
hex = "0.4"
blake3 = "1"
# Sync encrypts every file before it leaves the machine, so the relay stores ciphertext it cannot
# read. Pure Rust, no C dependency: this has to cross-compile to the phone alongside everything
# else, and a native crypto library is the thing most likely to stop it.
chacha20poly1305 = "0.10"
argon2 = "0.5"

# --- util ---
clap = { version = "4", features = ["derive", "env"] }
directories = "6"
uuid = { version = "1", features = ["v7", "serde"] }
# Used for the daemon's session token; a credential deserves an explicit CSPRNG rather than
# relying on whatever a convenience crate happens to use underneath.
getrandom = "0.3"
time = { version = "0.3", features = ["serde", "formatting", "parsing", "macros", "local-offset"] }
parking_lot = "0.12"
once_cell = "1"
indexmap = { version = "2", features = ["serde"] }
regex = "1"
rayon = "1"
num_cpus = "1"
sysinfo = "0.37"
raw-cpuid = "11"
tempfile = "3"
walkdir = "2"

# --- audio / dsp ---
cpal = "0.16"
rubato = "0.16"
rtrb = "0.3"
hound = "3"
# `all`, not `all-codecs`. Codecs decode a stream; *formats* are what a file is wrapped in, and
# `.m4a` and `.mp4` are ISO-BMFF containers — with codecs only, Symphonia refused both with "end of
# stream", which is every voice memo an iPhone makes and every recording Zoom writes.
symphonia = { version = "0.5", features = ["all"] }

# --- ml runtime ---
sherpa-rs = "0.6"
# llama.cpp in-process, for the translation model. Same shape of dependency as sherpa-rs: a C++
# library built at compile time, behind a feature, so the plain registry client does not pay for it.
llama-cpp-2 = "0.1.154"
ort = { version = "2.0.0-rc.10", default-features = false, features = ["std"] }
# Must match the version `ort` links against, and must keep `std` on — `ort` uses
# `ndarray::NdFloat`, which is gated behind it.
ndarray = { version = "0.17", features = ["std"] }

# --- storage ---
rusqlite = { version = "0.37", features = ["bundled", "backup", "functions", "serde_json", "time"] }

# --- dev ---
criterion = { version = "0.7", features = ["html_reports"] }
pretty_assertions = "1"
insta = { version = "1", features = ["json", "yaml"] }
proptest = "1"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = "symbols"
panic = "abort"

[profile.dev]
# Line tables, not full DWARF.
#
# A backtrace needs file and line; a step debugger needs types and locals. Almost every debug build
# here is run to get a panic message or a test failure, and full debug info is most of what the
# linker moves and most of what `target/debug` weighs. Anybody who does want to step through can
# put `debug = true` back for the session.
debug = "line-tables-only"

# Faster ONNX / DSP in debug builds so live-audio dev is usable.
[profile.dev.package."*"]
opt-level = 2

[profile.bench]
inherits = "release"
debug = true
strip = "none"
