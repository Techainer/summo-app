[package]
name = "summo-desktop"
description = "The Summo desktop shell"
version = "0.5.1"
edition = "2024"
rust-version = "1.90"
license = "AGPL-3.0-or-later"

# Excluded from the workspace: building this needs platform webview libraries (webkit2gtk on Linux,
# WebView2 on Windows), and requiring them to run `cargo test` on the core crates would make the
# workspace unbuildable on a plain CI runner or a headless server.
[workspace]

[build-dependencies]
tauri-build = { version = "2", features = [] }

# `#[tokio::test]` only. Kept out of the shipped feature set: the app's own runtime is Tauri's.
[dev-dependencies]
tokio = { version = "1", features = ["macros"] }

[dependencies]
# `image-png`: the tray icon is a PNG embedded in the binary, and without this feature
# `Image::from_bytes` does not exist — only a raw RGBA constructor, which would mean
# checking a decoded bitmap into the repository.
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-global-shortcut = "2"
tauri-plugin-dialog = "2"
tauri-plugin-shell = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "process", "time", "net"] }
tauri-plugin-deep-link = "2"
tauri-plugin-single-instance = { version = "2", features = ["deep-link"] }
