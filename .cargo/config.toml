# sherpa-onnx ships as shared libraries that land next to the binary in the target directory.
# Without an rpath the linker records only the file name, and the binary fails to start with
# "libsherpa-onnx-c-api.so: cannot open shared object file" unless LD_LIBRARY_PATH is set by hand.
# $ORIGIN resolves relative to the executable, which is also what the packaged app needs.
[target.'cfg(target_os = "linux")']
# `mold` when it is there, the system linker when it is not.
#
# Linking is the serial tail of every incremental build: the compiler parallelises across crates and
# then one process walks the whole binary. `summo-engine` with recognition links ONNX Runtime and
# sherpa-onnx, which is where the seconds go — mold does that pass several times faster.
#
# `-fuse-ld` is passed to the C compiler driver, which ignores it with a warning if mold is absent,
# so a machine without it still builds. That is why this is not an error to leave in.
rustflags = [
    "-C", "link-arg=-fuse-ld=mold",
    "-C", "link-arg=-Wl,-rpath,$ORIGIN",
]

[target.'cfg(target_os = "macos")']
rustflags = ["-C", "link-arg=-Wl,-rpath,@executable_path"]
