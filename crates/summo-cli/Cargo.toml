[package]
name = "summo-cli"
description = "Command line access to Summo's model registry and local store"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[features]
default = []
# Real transcription: Silero VAD plus a Zipformer transducer. Both link native code, so the
# default build stays a pure registry client.
transcribe = ["dep:summo-asr", "dep:summo-vad", "dep:hound", "summo-asr/sherpa", "summo-vad/silero"]
# `summo serve`: the daemon and the interface in this binary, the way `ollama serve` is one
# executable. `bundled` additionally bakes the built interface in.
serve = ["dep:summo-engine"]
bundled = ["serve", "summo-engine/bundled"]
# Real recognition inside `summo serve`.
models = ["serve", "summo-engine/models"]

[[bin]]
name = "summo"
path = "src/main.rs"

[dependencies]
summo-core.workspace = true
summo-media.workspace = true
summo-models.workspace = true
summo-llm.workspace = true
summo-vault.workspace = true
summo-engine = { workspace = true, optional = true }
time.workspace = true
summo-asr = { workspace = true, optional = true }
summo-vad = { workspace = true, optional = true }
hound = { workspace = true, optional = true }

anyhow.workspace = true
clap.workspace = true
reqwest.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio = { workspace = true }
tracing.workspace = true
tracing-subscriber.workspace = true

[dev-dependencies]
tempfile.workspace = true
