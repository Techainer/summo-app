[package]
name = "summo-cli"
description = "Command line access to Summo's model registry and local store"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[features]
default = ["mcp"]
# Real transcription: Silero VAD plus a Zipformer transducer. Both link native code, so the
# default build stays a pure registry client.
transcribe = ["dep:summo-asr", "dep:summo-vad", "dep:hound", "summo-asr/sherpa", "summo-vad/silero", "dep:summo-engine", "dep:summo-pipeline", "summo-engine/models"]
# `summo serve`: the daemon and the interface in this binary, the way `ollama serve` is one
# executable. `bundled` additionally bakes the built interface in.
serve = ["dep:summo-engine"]
# Translation inside this binary, with no model server to install or keep running.
#
# `mt-onnx` is the one the release ships: it builds with no C++ toolchain. `local-mt` adds the
# llama.cpp runtime for GGUF models on top. See `summo-engine`'s features for why they are split.
mt-onnx = ["dep:summo-engine", "summo-engine/mt-onnx"]
local-mt = ["dep:summo-engine", "summo-engine/local-mt"]
# `summo mcp`: the vault as tools for an MCP client. Tiny and pure Rust, so it is on by default —
# the one-binary story only holds if the binary actually has everything in it.
mcp = ["dep:summo-mcp"]
# `summo dub`: speak a translation over the recording it came from.
dub = ["dep:summo-tts", "summo-tts/sherpa", "dep:summo-engine", "dep:hound"]
bundled = ["serve", "summo-engine/bundled"]
# Real recognition inside `summo serve`.
models = ["serve", "summo-engine/models"]

[[bin]]
name = "summo"
path = "src/main.rs"

[dependencies]
summo-core.workspace = true
summo-media.workspace = true
summo-models.workspace = true
summo-llm.workspace = true
summo-sync.workspace = true
summo-vault.workspace = true
summo-engine = { workspace = true, optional = true }
summo-mcp = { workspace = true, optional = true }
summo-pipeline = { workspace = true, optional = true }
summo-tts = { workspace = true, optional = true }
time.workspace = true
summo-asr = { workspace = true, optional = true }
summo-vad = { workspace = true, optional = true }
hound = { workspace = true, optional = true }

anyhow.workspace = true
clap.workspace = true
reqwest.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio = { workspace = true }
tracing.workspace = true
tracing-subscriber.workspace = true

[dev-dependencies]
tempfile.workspace = true
