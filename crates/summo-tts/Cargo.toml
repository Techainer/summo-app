[package]
name = "summo-tts"
description = "Speech synthesis and dubbing: fitting a translated line back into the slot it came from"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[features]
default = []
# A real synthesiser, through sherpa-onnx's VITS runtime — the same native library the recogniser
# already links, so this adds a feature rather than a dependency. Off by default so the planning and
# mixing half builds anywhere, the same way `summo-vad` keeps Silero optional.
sherpa = ["dep:sherpa-rs"]

[dependencies]
summo-core.workspace = true
hound.workspace = true
serde.workspace = true
tracing.workspace = true
sherpa-rs = { workspace = true, optional = true, features = ["tts"] }


[dev-dependencies]
tempfile.workspace = true
