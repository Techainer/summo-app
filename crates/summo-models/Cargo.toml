[package]
name = "summo-models"
description = "Ollama-style model registry, manifests, resumable downloader and hardware probe"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
# Unpacking a model that ships as one file containing many — see `archive.rs`. All three are
# already in the lockfile as transitive dependencies of the build tooling, so this adds no new
# supply chain, only a direct edge to what is already there.
tar.workspace = true
bzip2.workspace = true
flate2.workspace = true
summo-core.workspace = true

serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tracing.workspace = true

tokio = { workspace = true }
futures.workspace = true
reqwest.workspace = true

sha2.workspace = true
hex.workspace = true

num_cpus.workspace = true
sysinfo.workspace = true

[target.'cfg(any(target_arch = "x86", target_arch = "x86_64"))'.dependencies]
raw-cpuid.workspace = true

[dev-dependencies]
# `net` for the download tests: they stand up two throwaway TCP listeners — one that refuses, one
# that answers — because the order the downloader tries its mirrors in is the whole point of them,
# and a `file://` URL cannot fail the way a blocked host does.
tokio = { workspace = true, features = ["rt", "macros", "test-util", "net"] }
tempfile.workspace = true
pretty_assertions.workspace = true
