[package]
name = "summo-engine"
description = "The local daemon: capture, recognition and events over a loopback socket"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[features]
default = []
# Real recognition. Off by default so the protocol and server can be built and tested anywhere.
models = [
    "dep:summo-vad",
    "dep:summo-asr",
    "summo-vad/silero",
    "summo-asr/sherpa",
    "summo-diar/sherpa",
]

[lib]
name = "summo_engine"
path = "src/lib.rs"

[[bin]]
name = "summo-engine"
path = "src/main.rs"

[dependencies]
summo-core.workspace = true
summo-models.workspace = true
summo-audio.workspace = true
summo-llm.workspace = true
summo-vault.workspace = true
summo-vad = { workspace = true, optional = true }
summo-asr = { workspace = true, optional = true }
summo-diar.workspace = true

anyhow.workspace = true
axum.workspace = true
clap.workspace = true
futures.workspace = true
parking_lot.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
tower-http.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
uuid.workspace = true
time.workspace = true
getrandom.workspace = true

[dev-dependencies]
tokio = { workspace = true, features = ["rt", "macros", "test-util"] }
pretty_assertions.workspace = true
tempfile.workspace = true
reqwest.workspace = true
hound.workspace = true
tokio-tungstenite = "0.28"
