[package]
name = "summo-engine"
description = "The local daemon: capture, recognition and events over a loopback socket"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[features]
# Translation without a second process, in one of two runtimes — and they are separate features
# because they cost different things to build.
#
# `mt-onnx` is the M2M100 family (SMALL100) through ONNX Runtime: pure Rust plus a prebuilt
# runtime, so it builds anywhere `cargo build` works. That is what makes it affordable to ship in
# the release, and without it the packaged app answers "this build cannot run a translation model
# in-process" — an offline-first product that cannot translate offline.
#
# `mt-gguf` is llama.cpp, which needs a C++ toolchain and CMake at build time. The models it serves
# (MiLMMT) are not redistributable anyway, so it stays opt-in for people building their own.
mt-onnx = ["dep:summo-mt", "summo-mt/onnx", "mt-any"]
mt-gguf = ["dep:summo-mt", "summo-mt/local", "mt-any"]
# Marker enabled by both, so the code shared between the runtimes has one `cfg` rather than an
# `any(...)` repeated at every use.
mt-any = []
# Both runtimes. Kept because it is the name every document and CI job already uses.
local-mt = ["mt-onnx", "mt-gguf"]
default = []
# Compile the built interface into the binary, so one executable is the whole app — the way
# `ollama` is one executable. Requires `apps/web/dist` to exist, which is why it is not default:
# `cargo test` on a machine with no Node must still work.
bundled = ["dep:include_dir"]
# Real recognition. Off by default so the protocol and server can be built and tested anywhere.
models = [
    "dep:summo-vad",
    "dep:summo-asr",
    "summo-vad/silero",
    "summo-asr/sherpa",
    "summo-diar/sherpa",
]

[lib]
name = "summo_engine"
path = "src/lib.rs"

[[bin]]
name = "summo-engine"
path = "src/main.rs"

[dependencies]
summo-core.workspace = true
summo-models.workspace = true
summo-audio.workspace = true
summo-llm.workspace = true
summo-mt = { workspace = true, optional = true }
summo-vault.workspace = true
summo-mcp.workspace = true
summo-vad = { workspace = true, optional = true }
summo-asr = { workspace = true, optional = true }
summo-diar.workspace = true
summo-agent.workspace = true
summo-media.workspace = true
summo-calendar.workspace = true
summo-pipeline.workspace = true

hound.workspace = true

anyhow.workspace = true
axum.workspace = true
clap.workspace = true
futures.workspace = true
parking_lot.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
tower-http.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
uuid.workspace = true
time.workspace = true
getrandom.workspace = true
include_dir = { version = "0.7.4", optional = true }

[dev-dependencies]
tokio = { workspace = true, features = ["rt", "macros", "test-util"] }
pretty_assertions.workspace = true
tempfile.workspace = true
reqwest.workspace = true
hound.workspace = true
tokio-tungstenite = "0.28"
