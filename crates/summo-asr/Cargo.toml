[package]
name = "summo-asr"
description = "Decoding sessions: streaming, aggressive pseudo-streaming, and the hybrid of both"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[features]
default = []
# Zipformer transducer decoding. Links a native library, so it is opt-in.
sherpa = ["dep:sherpa-rs"]

[dependencies]
summo-core.workspace = true
summo-vad.workspace = true

serde.workspace = true
tracing.workspace = true

sherpa-rs = { workspace = true, optional = true }

[dev-dependencies]
pretty_assertions.workspace = true
tempfile.workspace = true
