[package]
name = "summo-asr"
description = "Decoding sessions: streaming, aggressive pseudo-streaming, and the hybrid of both"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[features]
default = []
# Zipformer transducer decoding. Links a native library, so it is opt-in.
#
# `sherpa-rs/sys` comes with it because the speech enhancer has no safe wrapper in 0.6 — the
# recognisers, taggers and voices do, GTCRN does not — and `denoise.rs` calls the C entry points
# through the generated bindings. Same native library either way; this only unhides them.
sherpa = ["dep:sherpa-rs", "sherpa-rs/sys"]

[dependencies]
summo-core.workspace = true
summo-vad.workspace = true

serde.workspace = true
tracing.workspace = true

sherpa-rs = { workspace = true, optional = true }

[dev-dependencies]
pretty_assertions.workspace = true
tempfile.workspace = true
hound.workspace = true

# Needs a real ONNX Runtime to time: the whole question is how long sherpa takes to build a
# session, and without the feature the example does not compile at all. Declared here rather than
# guarded with `#[cfg]` inside the file, so `cargo test --workspace` on a default build skips it
# instead of failing on it.
[[example]]
name = "load-time"
required-features = ["sherpa"]
