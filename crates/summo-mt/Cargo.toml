[package]
name = "summo-mt"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[features]
# MiLMMT and other GGUF models, through llama.cpp. Behind a feature because it needs a C++
# toolchain, and a build that only needs the registry client should not pay for one.
local = ["dep:llama-cpp-2"]
# SMALL100 and the M2M100 family, through ONNX Runtime. Pure Rust plus a prebuilt `ort`, so this
# one costs no C++ build — which is why it is the path a plain `cargo build` can afford.
onnx = ["dep:ort", "dep:tokenizers", "dep:serde_json"]


[dependencies]
summo-core.workspace = true
tracing.workspace = true
llama-cpp-2 = { workspace = true, optional = true }
serde_json = { workspace = true, optional = true }
# `fancy-regex` rather than the default `onig`: onig is a C library, and the point of the ONNX
# path is that it needs no C++ toolchain to build.
tokenizers = { version = "0.23.1", default-features = false, features = [
    "fancy-regex",
], optional = true }

[dev-dependencies]
tempfile.workspace = true
# The `compare` example prints translations for two models side by side, and builds the prompt
# with the same function the daemon uses — comparing models on a different prompt would compare
# the prompts.
summo-llm.workspace = true

# Without the feature the crate is empty, so the example cannot compile — and `cargo clippy
# --all-targets` on a plain checkout would fail on it rather than skipping it.
[[example]]
name = "compare"
required-features = ["local", "onnx"]

# See the note in `summo-vad`: Intel macOS has no prebuilt ONNX Runtime to download, so it loads one
# at runtime from beside the binary instead of being dropped.
[target.'cfg(not(all(target_os = "macos", target_arch = "x86_64")))'.dependencies]
ort = { workspace = true, optional = true, features = ["download-binaries", "tls-rustls"] }

[target.'cfg(all(target_os = "macos", target_arch = "x86_64"))'.dependencies]
ort = { workspace = true, optional = true, features = ["load-dynamic"] }
