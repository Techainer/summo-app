[package]
name = "summo-bench"
description = "Measurement harness: VAD accuracy and latency, ASR WER and RTF"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[features]
default = ["sqlite"]
silero = ["summo-vad/silero"]
# ASR benchmarking needs a decoder, which links native code.
asr = ["dep:summo-asr", "summo-asr/sherpa"]
# SQLite as a storage candidate in the `voices` comparison.
sqlite = ["dep:rusqlite"]
# Turso/libSQL vector search, measured against a plain scan. Off by default: it is a
# several-minute build of a whole database engine, and nothing Summo ships depends on it.
#
# Mutually exclusive with `sqlite`: rusqlite and libsql each bundle their own copy of the
# SQLite amalgamation, and linking both defines every `sqlite3_*` symbol twice. Run it as
# `cargo run -p summo-bench --no-default-features --features turso -- turso`.
turso = ["dep:libsql", "dep:tokio"]

[[bin]]
name = "summo-bench"
path = "src/main.rs"

[dependencies]
summo-core.workspace = true
summo-vad.workspace = true
summo-asr = { workspace = true, optional = true }
libsql = { version = "0.9", optional = true }
tokio = { workspace = true, optional = true }

anyhow.workspace = true
clap.workspace = true
hound.workspace = true
rusqlite = { workspace = true, optional = true }
rayon.workspace = true
tempfile.workspace = true
serde.workspace = true
serde_json.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true

[dev-dependencies]
pretty_assertions.workspace = true
tempfile.workspace = true
